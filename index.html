<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shred">
<meta name="description" content="Denzel's fat-loss & abs plan: workouts, meals, groceries, cooking and progress.">
<title>Shred · Denzel's Plan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="tb-left">
      <div class="tb-kicker" id="tbKicker"></div>
      <h1 class="tb-title" id="tbTitle">Today</h1>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="view" class="view"></main>

  <div id="timer" class="timer hidden" role="timer" aria-live="polite">
    <svg class="timer-ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" class="tr-bg"/><circle cx="22" cy="22" r="19" class="tr-fg" id="timerArc"/></svg>
    <div class="timer-txt"><span class="timer-label">Rest</span><span class="timer-time" id="timerTime">1:30</span></div>
    <button class="timer-btn" data-t="-15">−15</button>
    <button class="timer-btn" data-t="15">+15</button>
    <button class="timer-btn skip" data-t="skip">Skip</button>
  </div>

  <nav class="tabbar" id="tabbar">
    <span class="tab-ind" id="tabInd"></span>
    <a href="#today" data-tab="today"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg><span>Today</span></a>
    <a href="#workout" data-tab="workout"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span>Workout</span></a>
    <a href="#meals" data-tab="meals"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v8a2 2 0 0 1-2 2M7 3v5M11 3v5M9 3v5"/><path d="M17 21V3c-2 1.5-3 4-3 7v3h3"/></svg><span>Meals</span></a>
    <a href="#groceries" data-tab="groceries"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11h10.6L20 7.5H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg><span>Grocery</span></a>
    <a href="#cook" data-tab="cook"><svg viewBox="0 0 24 24"><path d="M4 11h16v2a7 7 0 0 1-7 7h-2a7 7 0 0 1-7-7v-2z"/><path d="M20 11l2-2M9 7c0-1.5 1-1.5 1-3M13 7c0-1.5 1-1.5 1-3"/></svg><span>Cook</span></a>
    <a href="#progress" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M5 16l4.5-5 3.5 3 6-7"/><path d="M15 7h4v4"/></svg><span>Progress</span></a>
  </nav>

  <div id="sheet" class="sheet-wrap hidden">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true"><div class="sheet-grab"></div><div id="sheetBody"></div></div>
  </div>
  <div id="lightbox" class="lightbox hidden"><img alt=""><div class="lb-cap"></div></div>
  <div id="toast" class="toast"></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
